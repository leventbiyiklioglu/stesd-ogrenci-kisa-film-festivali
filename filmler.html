<script>
    document.addEventListener('DOMContentLoaded', () => {
        const filmContainer = document.getElementById('film-listesi') || document.querySelector('.film-grid') || document.body;

        fetch('data/approved_films.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) return;
                
                // Eğer özel bir konteyner varsa temizleyip filmleri basalım
                const container = document.getElementById('film-listesi');
                if (container) {
                    container.innerHTML = '';
                    data.forEach(film => {
                        const title = film.title || film.film_adi || 'İsimsiz Film';
                        const director = film.director || film.yonetmen || 'Belirtilmedi';
                        const duration = film.duration || film.sure || '';
                        const link = film.link || film.video_linki || '';

                        const card = document.createElement('div');
                        card.className = 'film-card';
                        card.style.cssText = 'background:#fff; border:1px solid #ddd; padding:15px; border-radius:8px; margin:10px 0;';
                        card.innerHTML = `
                            <h3 style="margin:0 0 8px 0; color:#0f2027;">${title}</h3>
                            <p style="margin:4px 0;">🎥 <strong>Yönetmen:</strong> ${director}</p>
                            ${duration ? `<p style="margin:4px 0;">⏱️ <strong>Süre:</strong> ${duration}</p>` : ''}
                            ${link ? `<a href="${link}" target="_blank" style="display:inline-block; margin-top:8px; color:#1a73e8;">🎬 Filmi İzle</a>` : ''}
                        `;
                        container.appendChild(card);
                    });
                }
            })
            .catch(err => console.error('Film yükleme hatası:', err));
    });
</script>
