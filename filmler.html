<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmler | STESD</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .film-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }
        .film-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .film-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .film-card h3 {
            margin-top: 0;
            color: #0f2027;
        }
        .film-card p {
            margin: 6px 0;
            color: #4a5568;
        }
        .film-card a {
            display: inline-block;
            margin-top: 10px;
            color: #1a73e8;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h2>STESD</h2>
            <p>Sinema ve Televizyon Eseri Sahipleri Derneği</p>
        </div>
        <nav>
            <a href="index.html">ANA SAYFA</a>
            <a href="hakkimizda.html">HAKKIMIZDA</a>
            <a href="faaliyetler.html">FAALİYETLER</a>
            <a href="uyelik.html">ÜYELİK</a>
            <a href="duyurular.html">DUYURULAR</a>
            <a href="yarisma.html">YARIŞMA</a>
            <a href="degerlendirme.html">DEĞERLENDİRME</a>
            <a href="filmler.html" class="active">FİLMLER</a>
            <a href="juri.html">JÜRİ</a>
            <a href="iletisim.html">İLETİŞİM</a>
        </nav>
    </header>

    <main class="film-container">
        <h1>Onaylanan Festival Filmleri</h1>
        <hr>
        <div id="film-listesi" class="film-grid">
            <p>Filmler yükleniyor...</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('film-listesi');

            fetch('data/approved_films.json?v=' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error('Ağ hatası');
                    return res.json();
                })
                .then(data => {
                    container.innerHTML = '';

                    if (!data || data.length === 0) {
                        container.innerHTML = '<p>Henüz onaylanmış film bulunmamaktadır.</p>';
                        return;
                    }

                    data.forEach(film => {
                        const title = film.title || film.film_adi || 'İsimsiz Film';
                        const director = film.director || film.yonetmen || 'Belirtilmedi';
                        const duration = film.duration || film.sure || '';
                        const link = film.link || film.video_linki || '';

                        const card = document.createElement('div');
                        card.className = 'film-card';
                        card.innerHTML = `
                            <h3>${title}</h3>
                            <p>🎥 <strong>Yönetmen:</strong> ${director}</p>
                            ${duration ? `<p>⏱️ <strong>Süre:</strong> ${duration}</p>` : ''}
                            ${link ? `<a href="${link}" target="_blank">🎬 Filmi İzle</a>` : ''}
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = '<p style="color:red;">Filmler yüklenirken bir hata oluştu.</p>';
                });
        });
    </script>

</body>
</html>
