<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STESD - Öğrenci Kısa Film Festivali</title>
    <style>
        :root {
            --primary-color: #0f2027;
            --accent-color: #d4af37;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 40px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 30px;
            margin-bottom: 40px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }

        p.subtitle {
            color: #666;
            margin: 0;
            font-size: 1.1rem;
        }

        .film-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .film-card {
            background: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .film-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .film-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a365d;
            margin: 0 0 10px 0;
        }

        .film-info {
            font-size: 0.95rem;
            color: #4a5568;
            margin: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .film-badge {
            display: inline-block;
            background: #e2e8f0;
            color: #2d3748;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 10px;
            width: fit-content;
        }

        .film-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 16px;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .film-link:hover {
            background-color: #203a43;
        }

        .error-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: #e53e3e;
            font-weight: 600;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Sinema ve Televizyon Eseri Sahipleri Derneği</h1>
        <p class="subtitle">Öğrenci Kısa Film Festivali - Onaylanan Filmler Listesi</p>
    </header>

    <div id="film-listesi" class="film-grid">
        <p style="grid-column: 1/-1; text-align: center; color: #718096;">Filmler yükleniyor...</p>
    </div>
</div>

<script>
    fetch('data/approved_films.json?v=' + new Date().getTime())
        .then(response => {
            if (!response.ok) throw new Error('Ağ hatası');
            return response.json();
        })
        .then(data => {
            const container = document.getElementById('film-listesi');
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">Henüz onaylanan film bulunmamaktadır.</p>';
                return;
            }

            data.forEach(film => {
                const title = film.title || film.film_adi || 'İsimsiz Film';
                const director = film.director || film.yonetmen || 'Belirtilmedi';
                const duration = film.duration || film.sure || '';
                const category = film.category || film.kategori || 'Kısa Film';
                const link = film.link || film.video_linki || film.url || '';

                const card = document.createElement('div');
                card.className = 'film-card';

                card.innerHTML = `
                    <div>
                        <h3 class="film-title">${title}</h3>
                        <p class="film-info">🎥 <strong>Yönetmen:</strong> ${director}</p>
                        ${duration ? `<p class="film-info">⏱️ <strong>Süre:</strong> ${duration}</p>` : ''}
                        <span class="film-badge">${category}</span>
                    </div>
                    ${link ? `<a href="${link}" target="_blank" class="film-link">🎬 Filmi İzle</a>` : ''}
                `;

                container.appendChild(card);
            });
        })
        .catch(error => {
            console.error('Hata:', error);
            document.getElementById('film-listesi').innerHTML = '<p class="error-msg">Filmler yüklenirken bir hata oluştu.</p>';
        });
</script>

</body>
</html>
