<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Sayfa | STESD Öğrenci Kısa Film Festivali</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a2a3a; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .film-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .film-card { border: 1px solid #e1e8ed; padding: 15px; border-radius: 10px; background: #fafbfc; transition: transform 0.2s; }
        .film-card:hover { transform: translateY(-3px); }
        .film-title { font-weight: bold; font-size: 1.1em; color: #0056b3; }
        .film-director { color: #555; margin: 5px 0; }
        .film-link { display: inline-block; margin-top: 10px; padding: 8px 12px; background: #e63946; color: #fff; text-decoration: none; border-radius: 5px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sinema ve Televizyon Eseri Sahipleri Derneği</h1>
        <p class="subtitle">Öğrenci Kısa Film Festivali - Onaylanan Filmler Listesi</p>
        
        <div id="film-listesi" class="film-grid">
            <p>Onaylanan filmler yükleniyor...</p>
        </div>
    </div>

    <script>
        fetch('./data/approved_films.json')
            .then(res => res.json())
            .then(films => {
                const container = document.getElementById('film-listesi');
                container.innerHTML = '';

                if (!films || films.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">Henüz onaylanan film bulunmamaktadır.</p>';
                    return;
                }

                films.forEach(film => {
                    const card = `
                        <div class="film-card">
                            <div class="film-title">${film.title}</div>
                            <div class="film-director">🎥 Yönetmen: ${film.director}</div>
                            ${film.video_url ? `<a href="${film.video_url}" target="_blank" class="film-link">🎬 Filmi İzle</a>` : ''}
                        </div>
                    `;
                    container.innerHTML += card;
                });
            })
            .catch(err => {
                console.error("Film verisi yüklenirken hata oluştu:", err);
                document.getElementById('film-listesi').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #c0392b;">Filmler yüklenirken bir hata oluştu.</p>';
            });
    </script>
</body>
</html>
